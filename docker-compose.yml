services:
  hermes-bjemploi:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-bjemploi
    shm_size: 1g
    volumes:
      - ./infra/hermes/config.yaml:/root/.hermes/config.yaml
      - ./infra/hermes/profiles.yaml:/root/.hermes/profiles.yaml
      - ./sites/bjemploi/cookies.json:/root/cookies.json
      - ./job.md:/root/job.md
      - ./skills:/root/.hermes/skills
      - hermes-bjemploi-data:/root/.hermes
    environment:
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
    network_mode: host
    restart: unless-stopped

